# ============================================================
# Quid App — Docker Compose (Production)
# ============================================================
# Levanta únicamente la App de Quid.
# Aura-Standalone tiene su propio docker-compose en f:\Proyectos\Aura-Standalone\
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: quid-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quid}
      POSTGRES_USER: ${POSTGRES_USER:-quid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quid-local-dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - quid-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quid} -d ${POSTGRES_DB:-quid}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  quid-app:
    build:
      context: ./Quid-App
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    container_name: quid-app
    # Todas las variables salen de Quid-App/.env: UNA sola fuente de verdad, para
    # que el valor de una variable no dependa de en qué archivo se declare.
    # `required: false` permite que `docker compose config` y los comandos que no
    # tocan la app (por ejemplo `logs quid-cron`) sigan funcionando si falta.
    env_file:
      - path: ./Quid-App/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # NOTA sobre precedencia: en Docker, el bloque `environment` PISA a
      # `env_file` cuando ambos definen la misma variable. Por eso la
      # configuración de IA y el token de Aura NO están acá: viven una sola vez
      # en Quid-App/.env, que es el env_file de este servicio.
      #
      # Ojo con el orden de merge de compose: si una variable está en el .env de
      # la RAÍZ, `docker compose` la sustituye acá y también pisa al env_file.
      # Por eso DATABASE_URL, NEXTAUTH_SECRET y AUTH_COOKIE_SECURE del .env raíz
      # deben estar en consonancia con Quid-App/.env.
      - NEXTAUTH_TRUSTHOST=true
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:quid@app.com}
      - ODYSSEUS_ENABLED=${ODYSSEUS_ENABLED:-false}
      - ODYSSEUS_API_URL=${ODYSSEUS_API_URL:-}
      - ODYSSEUS_API_TOKEN=${ODYSSEUS_API_TOKEN:-}
      - ODYSSEUS_SESSION_ID=${ODYSSEUS_SESSION_ID:-}
      - MEDICATION_REMINDER_WINDOW_MINUTES=${MEDICATION_REMINDER_WINDOW_MINUTES:-2}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - default
      - quid-ai-net

  quid-cron:
    image: curlimages/curl:8.11.1
    container_name: quid-cron
    depends_on:
      quid-app:
        condition: service_started
    environment:
      - CRON_SECRET=${CRON_SECRET:-local-cron-secret-change-me}
      - AURA_API_KEY=${AURA_API_KEY:-AuraSecretKey2026}
      - AURA_DIGEST_URL=${AURA_DIGEST_URL:-}
      - CRON_INTERVAL_SECONDS=${CRON_INTERVAL_SECONDS:-60}
    command:
      - sh
      - -c
      - |
        while true; do
          date
          curl -fsS "http://quid-app:3000/api/push/reminders?token=$${CRON_SECRET}" || true
          echo
          if [ -n "$${AURA_DIGEST_URL}" ]; then
            curl -fsS -X POST "$${AURA_DIGEST_URL}" -H "x-aura-token: $${AURA_API_KEY}" || true
            echo
          fi
          sleep "$${CRON_INTERVAL_SECONDS}"
        done
    restart: unless-stopped
    networks:
      - default
      - quid-ai-net

volumes:
  quid-postgres-data:

# Red compartida con el router de IA (FreeLLMAPI), que vive en su propio
# compose. Se declara externa para no acoplar los dos despliegues: el router
# puede recrearse sin tocar Quid. Crearla una vez con:
#   docker network create quid-ai-net
networks:
  quid-ai-net:
    name: quid-ai-net
    external: true
