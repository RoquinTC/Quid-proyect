# ============================================================
# Quid App — Docker Compose (Production)
# ============================================================
# Levanta únicamente la App de Quid.
# Aura-Standalone tiene su propio docker-compose en f:\Proyectos\Aura-Standalone\
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: quid-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quid}
      POSTGRES_USER: ${POSTGRES_USER:-quid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quid-local-dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - quid-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quid} -d ${POSTGRES_DB:-quid}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  quid-app:
    build:
      context: ./Quid-App
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    container_name: quid-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # NOTA sobre precedencia (esto ya causó un bug): en Docker el bloque
      # `environment` PISA a cualquier otro origen, y `docker compose` sustituye
      # ${VAR} desde el .env de la RAÍZ. Por eso TODA la configuración de la app
      # vive en el .env de la raíz, en AMBOS entornos (local y servidor): así el
      # valor efectivo no depende de un orden de merge que nadie recuerda.
      #
      # Quid-App/.env NO se usa en Docker. Existe sólo para correr Next fuera de
      # contenedores (`npm run dev`) y para `prisma` en el host.
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql://quid:quid-local-dev@postgres:5432/quid?schema=public}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_TRUSTHOST=true
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:quid@app.com}
      - AURA_API_KEY=${AURA_API_KEY:-AuraSecretKey2026}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - CRON_SECRET=${CRON_SECRET:-local-cron-secret-change-me}
      # ── Backend de IA ──
      # Se eliminó Ollama: consumía demasiada RAM en el servidor y tumbó la
      # máquina. Ahora se usa un router OpenAI-compatible (FreeLLMAPI).
      #
      # El default es el TÚNEL, que funciona desde cualquier entorno. El servidor
      # lo sobrescribe en su .env con la URL interna de Docker, que evita dar la
      # vuelta por internet.
      #
      # OJO al usar la URL interna: el host debe ser el NOMBRE DEL CONTENEDOR
      # (freellmapi-freellmapi-1). Docker sólo crea el alias corto del servicio
      # dentro de su propio proyecto compose, así que `freellmapi` a secas NO
      # resuelve entre proyectos distintos.
      # Ver Quid-App/src/lib/ai/llm.ts para el cliente que habla con ambos.
      - AI_BASE_URL=${AI_BASE_URL:-https://freellmapi.roquintc.app/v1}
      - AI_MODEL=${AI_MODEL:-auto}
      - AI_API_KEY=${AI_API_KEY:-}
      - ODYSSEUS_ENABLED=${ODYSSEUS_ENABLED:-false}
      - ODYSSEUS_API_URL=${ODYSSEUS_API_URL:-}
      - ODYSSEUS_API_TOKEN=${ODYSSEUS_API_TOKEN:-}
      - ODYSSEUS_SESSION_ID=${ODYSSEUS_SESSION_ID:-}
      - MEDICATION_REMINDER_WINDOW_MINUTES=${MEDICATION_REMINDER_WINDOW_MINUTES:-2}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - default
      - quid-ai-net

  quid-cron:
    image: curlimages/curl:8.11.1
    container_name: quid-cron
    depends_on:
      quid-app:
        condition: service_started
    environment:
      - CRON_SECRET=${CRON_SECRET:-local-cron-secret-change-me}
      - AURA_API_KEY=${AURA_API_KEY:-AuraSecretKey2026}
      - AURA_DIGEST_URL=${AURA_DIGEST_URL:-}
      - CRON_INTERVAL_SECONDS=${CRON_INTERVAL_SECONDS:-60}
    command:
      - sh
      - -c
      - |
        while true; do
          date
          curl -fsS "http://quid-app:3000/api/push/reminders?token=$${CRON_SECRET}" || true
          echo
          if [ -n "$${AURA_DIGEST_URL}" ]; then
            curl -fsS -X POST "$${AURA_DIGEST_URL}" -H "x-aura-token: $${AURA_API_KEY}" || true
            echo
          fi
          sleep "$${CRON_INTERVAL_SECONDS}"
        done
    restart: unless-stopped
    networks:
      - default
      - quid-ai-net

volumes:
  quid-postgres-data:

# Red compartida con el router de IA (FreeLLMAPI), que vive en su propio
# compose. Se declara externa para no acoplar los dos despliegues: el router
# puede recrearse sin tocar Quid. Crearla una vez con:
#   docker network create quid-ai-net
networks:
  quid-ai-net:
    name: quid-ai-net
    external: true
